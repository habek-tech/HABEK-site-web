<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Image de partage — page Scolo (1200×630)</title>
<!--
  Source de assets/og-scolo.png (image d'aperçu WhatsApp / Facebook / LinkedIn de la page Scolo).
  Régénérer (Edge ou Chrome) :
    msedge --headless=new --disable-gpu --hide-scrollbars --window-size=1200,630 --screenshot=assets/og-scolo.png file:///…/brand/og/og-scolo.html
-->
<style>
  @font-face { font-family: 'Fraunces'; font-weight: 500 700; src: url('../../assets/fonts/fraunces-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 400 600; src: url('../../assets/fonts/inter-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fbf7f0; }
  body { font-family: 'Inter', system-ui, sans-serif; color: #2b2118; position: relative; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 18px; background: #16213e; }
  .brand { position: absolute; left: 64px; top: 52px; display: flex; align-items: center; gap: 14px; }
  .brand img { height: 46px; width: auto; }
  .brand span { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 34px; letter-spacing: 0.04em; }
  .pill { position: absolute; left: 64px; top: 150px; background: #5c7a52; color: #fbf7f0; font-size: 18px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; padding: 7px 18px; border-radius: 8px; }
  h1 { position: absolute; left: 64px; top: 206px; width: 560px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 54px; line-height: 62px; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: #8a6a35; }
  .sub { position: absolute; left: 64px; bottom: 74px; font-size: 24px; line-height: 32px; width: 540px; color: #6b6152; }
  .sub strong { color: #2b2118; font-weight: 600; }
  .panel { position: absolute; right: 48px; top: 48px; width: 500px; height: 534px; border-radius: 28px; background: #16213e; }
  .desk { position: absolute; left: 24px; top: 70px; width: 420px; border-radius: 14px; overflow: hidden; border: 4px solid #3c4c73; background: #10213a; }
  .desk img { display: block; width: 100%; height: auto; }
  .phone { position: absolute; right: 22px; bottom: 36px; width: 150px; border-radius: 22px; overflow: hidden; border: 5px solid #3c4c73; background: #10213a; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .phone img { display: block; width: 100%; height: auto; }
  .cap { position: absolute; left: 0; right: 0; top: 22px; text-align: center; font-size: 17px; color: rgba(251,247,240,.8); }
</style>
</head>
<body>
  <div class="brand"><img src="../../assets/icon.svg" alt=""><span>HABEK</span></div>
  <div class="pill">Scolo · Disponible</div>
  <h1>Suivez les frais de scolarité et <em>relancez les parents.</em></h1>
  <p class="sub"><strong>Écoles privées du Burkina Faso</strong> · relances WhatsApp et SMS, tableaux de bord</p>
  <div class="panel">
    <div class="cap">Aperçu de la démo — données fictives</div>
    <div class="desk"><img src="../../assets/shots/scolo-tableau-de-bord.webp" alt=""></div>
    <div class="phone"><img src="../../assets/shots/scolo-relances-mobile.webp" alt=""></div>
  </div>
  <div class="bar"></div>
</body>
</html>
